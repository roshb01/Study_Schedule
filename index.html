<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>לו"ז למידה - מבחן שלב א'</title>
<style>
  :root{
    --bg: #f6f5f2;
    --panel: #ffffff;
    --ink: #23262b;
    --ink-soft: #6b6f76;
    --line: #e4e2dc;
    --navy: #223047;
    --navy-soft: #3c5170;
    --gold: #b8863b;
    --gabbe: #b0555a;      /* מיילדות - rose */
    --gabbe-bg: #f8e9e9;
    --novak: #2f7a68;      /* גניקולוגיה - teal */
    --novak-bg: #e4f2ec;
    --speroff: #b1791f;    /* פוריות - amber */
    --speroff-bg: #f8ecd8;
    --ok: #2f7a4f;
    --warn: #b3452f;
    --oncall-bg: #fdf1e3;
    --after-bg: #fdf7e8;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: 'Segoe UI', 'Heebo', Arial, sans-serif;
    font-size:15px;
    line-height:1.5;
  }
  #app{max-width:1180px;margin:0 auto;padding:18px 18px 60px;}

  /* header */
  .hero{
    background:linear-gradient(135deg,var(--navy),var(--navy-soft));
    color:#fff;
    border-radius:16px;
    padding:22px 26px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; left:-40px; top:-60px;
    width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle, rgba(184,134,59,0.35), transparent 70%);
  }
  .hero h1{margin:0 0 4px; font-size:22px; font-weight:700;}
  .hero .sub{color:#cdd6e3; font-size:13.5px;}
  .hero-stats{display:flex; gap:14px; margin-top:16px; flex-wrap:wrap;}
  .stat-card{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:12px;
    padding:10px 16px;
    min-width:130px;
  }
  .stat-card .num{font-size:20px; font-weight:700;}
  .stat-card .lbl{font-size:11.5px; color:#c9d2e0;}

  .progress-outer{background:rgba(255,255,255,0.15); border-radius:8px; height:10px; overflow:hidden; margin-top:6px;}
  .progress-inner{height:100%; background:var(--gold); border-radius:8px; transition:width .3s;}

  /* tabs */
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; border-bottom:2px solid var(--line); padding-bottom:0;}
  .tab-btn{
    background:transparent; border:none; cursor:pointer;
    padding:10px 16px; font-size:14px; font-weight:600; color:var(--ink-soft);
    border-bottom:3px solid transparent; margin-bottom:-2px;
    font-family:inherit;
  }
  .tab-btn.active{color:var(--navy); border-bottom-color:var(--gold);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; margin-bottom:16px;
  }
  .card h2{margin:0 0 4px; font-size:17px;}
  .card .hint{color:var(--ink-soft); font-size:13px; margin-bottom:14px;}

  /* domain progress bars */
  .domain-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .domain-tag{
    min-width:78px; text-align:center; font-size:12.5px; font-weight:700;
    padding:4px 8px; border-radius:6px;
  }
  .domain-row .bar-outer{flex:1; background:var(--line); border-radius:6px; height:14px; overflow:hidden;}
  .domain-row .bar-inner{height:100%; border-radius:6px;}
  .domain-row .pct{min-width:48px; text-align:left; font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .gabbe-tag{background:var(--gabbe-bg); color:var(--gabbe);}
  .novak-tag{background:var(--novak-bg); color:var(--novak);}
  .speroff-tag{background:var(--speroff-bg); color:var(--speroff);}

  /* today card */
  .today-date{font-size:14px; color:var(--ink-soft); margin-bottom:2px;}
  .today-head{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .daytype-select{
    padding:6px 10px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:13.5px;
    background:#fff;
  }
  .assign-list{margin-top:14px; display:flex; flex-direction:column; gap:10px;}
  .assign-item{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .assign-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;}
  .assign-title{font-weight:700; font-size:14.5px;}
  .assign-meta{font-size:12.5px; color:var(--ink-soft);}
  .assign-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .assign-controls input[type=number]{
    width:70px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-family:inherit;
  }
  .btn{
    cursor:pointer; border:none; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600;
    font-family:inherit; background:var(--navy); color:#fff;
  }
  .btn.secondary{background:#fff; border:1px solid var(--line); color:var(--ink);}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:default;}
  .pill{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
  }
  .pill.done{background:#e2f2e7; color:var(--ok);}
  .pill.partial{background:#fdf1e3; color:var(--gold);}
  .pill.todo{background:#f0eee9; color:var(--ink-soft);}

  .daily-fixed{display:flex; gap:18px; margin-top:14px; flex-wrap:wrap;}
  .fixed-item{display:flex; align-items:center; gap:8px; font-size:13.5px;}
  .fixed-item input[type=checkbox]{width:17px; height:17px;}
  .fixed-item input[type=number]{width:60px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-family:inherit;}

  /* calendar / monthly on-call */
  .month-picker{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  textarea{
    width:100%; min-height:60px; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:inherit; font-size:13.5px; resize:vertical;
  }
  .oncall-days{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .day-chip{
    font-size:12px; padding:4px 9px; border-radius:16px; border:1px solid var(--line); background:#fff;
  }
  .day-chip.oncall{background:var(--oncall-bg); border-color:var(--gold); color:var(--gold); font-weight:700;}
  .day-chip.after{background:var(--after-bg); border-color:#d8c27a; color:#8a6d21;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft); font-weight:600; font-size:12px; position:sticky; top:0; background:var(--panel);}
  tr:hover td{background:#faf9f7;}
  .chapter-table-wrap{max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:10px;}
  .src-badge{font-size:10.5px; padding:2px 7px; border-radius:5px; background:#f0eee9; color:var(--ink-soft);}

  .settings-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px;}
  .setting-item label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px;}
  .setting-item input{width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px; font-family:inherit;}

  .cal-day-list{max-height:600px; overflow:auto; display:flex; flex-direction:column; gap:6px;}
  .cal-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    font-size:13px;
  }
  .cal-row.today-row{border-color:var(--gold); background:#fffdf7;}
  .cal-date{min-width:96px; font-weight:600; color:var(--ink-soft); font-size:12px;}
  .cal-type{min-width:60px; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; text-align:center;}
  .cal-type.regular{background:#eef1f5; color:var(--navy-soft);}
  .cal-type.oncall{background:var(--oncall-bg); color:var(--gold);}
  .cal-type.after{background:var(--after-bg); color:#8a6d21;}
  .cal-assign{flex:1; display:flex; flex-wrap:wrap; gap:6px;}
  .cal-chip{font-size:11.5px; padding:2px 8px; border-radius:6px;}

  .empty-note{color:var(--ink-soft); font-size:13px; text-align:center; padding:30px 10px;}
  .footnote{color:var(--ink-soft); font-size:12px; margin-top:6px;}
  select, input{font-family:inherit;}
  .filter-row{display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
  .filter-row select, .filter-row input{padding:6px 10px; border:1px solid var(--line); border-radius:7px;}

  /* ============ MOBILE RESPONSIVE ============ */
  @media (max-width: 640px){
    #app{padding:10px 10px 40px;}
    .hero{padding:16px 16px; border-radius:12px;}
    .hero h1{font-size:18px;}
    .hero .sub{font-size:12px;}
    .hero-stats{gap:8px;}
    .stat-card{min-width:0; flex:1 1 100%; padding:9px 12px;}
    .stat-card .num{font-size:17px;}

    .tabs{
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      gap:2px; padding-bottom:2px; scrollbar-width:thin;
    }
    .tab-btn{flex:0 0 auto; padding:9px 12px; font-size:13px; white-space:nowrap;}

    .card{padding:13px; border-radius:8px;}
    .card h2{font-size:15.5px;}

    .today-head{flex-direction:column; align-items:flex-start;}
    .daytype-select{width:100%;}

    .assign-item{padding:10px;}
    .assign-title{font-size:13.5px;}
    .assign-controls{width:100%;}
    .assign-controls input[type=number]{flex:0 0 70px;}
    .assign-controls .btn{flex:1;}

    .domain-row{flex-wrap:wrap;}
    .domain-row .bar-outer{flex:1 1 100%; order:3;}
    .domain-tag{order:1;}
    .domain-row .pct{order:2; margin-inline-start:auto;}

    .settings-grid{grid-template-columns:1fr;}
    .month-picker{flex-wrap:wrap;}

    table{font-size:12px;}
    .chapter-table-wrap table{min-width:640px;} /* keeps columns readable; wrapper scrolls horizontally */
    th, td{padding:6px 8px;}

    .cal-row{flex-wrap:wrap;}
    .cal-date{min-width:0; flex:0 0 auto;}

    .filter-row{flex-direction:column;}
    .filter-row select{width:100%;}
  }
</style>
<script>
window.storage = {
  get: async function(key, shared){
    const raw = localStorage.getItem(key);
    if(raw === null) throw new Error('Key not found: ' + key);
    return {key, value: raw, shared: !!shared};
  },
  set: async function(key, value, shared){
    localStorage.setItem(key, value);
    return {key, value, shared: !!shared};
  },
  delete: async function(key, shared){
    const existed = localStorage.getItem(key) !== null;
    localStorage.removeItem(key);
    return {key, deleted: existed, shared: !!shared};
  },
  list: async function(prefix, shared){
    const keys = [];
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      if(!prefix || k.startsWith(prefix)) keys.push(k);
    }
    return {keys, prefix, shared: !!shared};
  }
};
</script>

  const byBook = { Gabbe: [], Novak: [], Speroff: [] };
  CHAPTERS_RAW.forEach(c => byBook[c.book].push(c));
  Object.values(byBook).forEach(arr => arr.sort((a,b)=> b.roi - a.roi));

  function roundRobin(list){
    const queues = { Gabbe:[...list.Gabbe], Novak:[...list.Novak], Speroff:[...list.Speroff] };
    const order = ["Gabbe","Novak","Speroff"];
    const out = [];
    let remaining = true;
    while(remaining){
      remaining = false;
      for(const b of order){
        if(queues[b].length){ out.push(queues[b].shift()); remaining = true; }
      }
    }
    return out;
  }

  const phase1Order = roundRobin(byBook);
  const phase1Units = phase1Order.map(c => ({
    key: chapterKey(c)+"-p1", chapterKey: chapterKey(c), book:c.book, ch:c.ch, name:c.name,
    roi:c.roi, phase:1, pages:c.pp, kind: (c.src==="summary" ? "summary" : "book"),
  }));

  const phase2Source = { Gabbe:[], Novak:[], Speroff:[] };
  CHAPTERS_RAW.filter(c=>c.rp>0).forEach(c=>phase2Source[c.book].push(c));
  Object.values(phase2Source).forEach(arr=>arr.sort((a,b)=>b.roi-a.roi));
  const phase2Order = roundRobin(phase2Source);
  const phase2Units = phase2Order.map(c => ({
    key: chapterKey(c)+"-p2", chapterKey: chapterKey(c), book:c.book, ch:c.ch, name:c.name,
    roi:c.roi, phase:2, pages:c.rp, kind:"review",
  }));

  return [...phase1Units, ...phase2Units];
}

const UNITS = buildUnits();
const TOTAL_PAGES_ALL = UNITS.reduce((s,u)=>s+u.pages,0);
const TOTAL_PAGES_BY_BOOK = {Gabbe:0,Novak:0,Speroff:0};
CHAPTERS_RAW.forEach(c=> TOTAL_PAGES_BY_BOOK[c.book]+= c.pp + c.rp);

// One-time migration: Speroff chapters were renumbered to match the official 10th-edition
// syllabus (the previous numbering mixed 9th/10th-edition chapter numbers). This remaps any
// existing progress keys so nothing gets silently lost. Safe to run repeatedly (no-op once done).
const SPEROFF_CH_MIGRATION = {
  17:22, 18:16, 19:17, 21:24, 22:25, 23:26, 24:27, 25:28, 26:29, 27:30, 28:31, 29:32, 30:33, 31:34, 32:35
};
function migrateSperoffKeys(state){
  if(!state.unitProgress) return state;
  const newProgress = {};
  let migrated = false;
  Object.keys(state.unitProgress).forEach(key=>{
    const m = key.match(/^Speroff-(\d+)-(p1|p2)$/);
    if(m){
      const oldCh = Number(m[1]);
      const newCh = SPEROFF_CH_MIGRATION[oldCh];
      if(newCh){
        newProgress[`Speroff-${newCh}-${m[2]}`] = state.unitProgress[key];
        migrated = true;
        return;
      }
      if(oldCh === 20){ migrated = true; return; } // chapter removed (now excluded) - drop silently
    }
    newProgress[key] = state.unitProgress[key];
  });
  if(migrated) state.unitProgress = newProgress;
  return state;
}

function mergeIncomingState(incoming){
  incoming = migrateSperoffKeys(incoming);
  STATE = { ...STATE, ...incoming,
    settings: {...DEFAULT_SETTINGS, ...(incoming.settings||{})},
    unitProgress: incoming.unitProgress || {},
    dayOverrides: incoming.dayOverrides || {},
    dailyLog: incoming.dailyLog || {},
    syllabusManual: incoming.syllabusManual || {},
    researchHours: incoming.researchHours || {},
    stage2: {
      weakChapters: (incoming.stage2 && incoming.stage2.weakChapters) || [],
      examCount: (incoming.stage2 && incoming.stage2.examCount) ?? null,
      daysPerExam: (incoming.stage2 && incoming.stage2.daysPerExam) ?? 4,
      targetExamDate: (incoming.stage2 && incoming.stage2.targetExamDate) || null,
      progressLog: (incoming.stage2 && incoming.stage2.progressLog) || [],
    },
  };
}

async function loadState(){

    if(r && r.value){

  }catch(e){ console.log('אין נתונים שמורים עדיין (זו הפעילות הראשונה) - זה תקין.'); }

      mergeIncomingState(remote);
      try{ await window.storage.set('study-state', JSON.stringify(STATE)); }catch(e){}

}

/* ============================================================
   OPTIONAL CROSS-DEVICE SYNC (GitHub Gist)
   Lets two devices (e.g. iPad + phone) share the same progress
   by using a private GitHub Gist as a tiny personal cloud store.
   Config (token + gist id) is stored locally per-device via the
   same storage abstraction, under a separate key.
   ============================================================ */
const GIST_FILENAME = 'study-tracker-state.json';

async function getSyncConfig(){
  try{
    const r = await window.storage.get('gist-sync-config');
    return r && r.value ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function setSyncConfig(cfg){
  await window.storage.set('gist-sync-config', JSON.stringify(cfg));
}

async function pullFromGist(){
  const cfg = await getSyncConfig();
  if(!cfg || !cfg.token || !cfg.gistId) return null;
  const resp = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
    headers: { 'Authorization': `token ${cfg.token}`, 'Accept': 'application/vnd.github+json' }
  });
  if(!resp.ok) throw new Error('gist pull failed: ' + resp.status);
  const data = await resp.json();
  const file = data.files && data.files[GIST_FILENAME];
  if(!file || !file.content) return null;
  return JSON.parse(file.content);
}

async function pushToGist(){
  const cfg = await getSyncConfig();
  if(!cfg || !cfg.token || !cfg.gistId) return;
  const resp = await fetch(`https://api.github.com/gists/${cfg.gistId}`, {
    method: 'PATCH',
    headers: { 'Authorization': `token ${cfg.token}`, 'Accept': 'application/vnd.github+json' },
    body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(STATE) } } })
  });
  if(!resp.ok) throw new Error('gist push failed: ' + resp.status);
  const cfg2 = await getSyncConfig();
  await setSyncConfig({...cfg2, lastSynced: new Date().toISOString()});
}

async function createGist(token){
  const resp = await fetch('https://api.github.com/gists', {
    method: 'POST',
    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' },
    body: JSON.stringify({
      description: 'לו״ז למידה - נתוני מעקב (פרטי)',
      public: false,
      files: { [GIST_FILENAME]: { content: JSON.stringify(STATE) } }
    })
  });
  if(!resp.ok) throw new Error('gist creation failed: ' + resp.status);
  const data = await resp.json();
  return data.id;
}

/* ============================================================
   DATE HELPERS
   ============================================================ */
function fmt(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseLocalDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(dateStr, n){
  const d = parseLocalDate(dateStr);
  d.setDate(d.getDate()+n);
  return fmt(d);
}
function dayLabel(dateStr){
  const d = parseLocalDate(dateStr);
  return d.toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'numeric'});
}
function monthKey(dateStr){ return dateStr.slice(0,7); }
function todayStr(){
  return fmt(new Date());
}

// default on-call assumption for months the user hasn't entered yet: every 5th day
function defaultOnCallForMonth(ymKey){
  const [y,m] = ymKey.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const set = new Set();
  for(let d=5; d<=daysInMonth; d+=5) set.add(d);
  return set;
}

function getDayType(dateStr){
  if(STATE.dayOverrides[dateStr]) return STATE.dayOverrides[dateStr];
  const ymKey = monthKey(dateStr);
  const hasManualMonth = STATE.dayOverrides['__month_entered__'+ymKey];
  const day = Number(dateStr.slice(8,10));
  if(hasManualMonth){
    return 'regular'; // manual entries already set individual days; absence = regular
  }
  const oncallSet = defaultOnCallForMonth(ymKey);
  if(oncallSet.has(day)) return 'oncall';
  if(oncallSet.has(day-1)) return 'after';
  return 'regular';
}

function hoursForType(type){
  if(type==='regular') return STATE.settings.regularHours;
  return STATE.settings.reducedHours; // oncall or after
}

function researchHoursFor(dateStr){
  return STATE.researchHours[dateStr] || 0;
}

function netStudyHours(dateStr, type){
  return Math.max(0, hoursForType(type) - STATE.settings.dailyFixedHours - researchHoursFor(dateStr));
}

function countResearchDaysInMonth(ymKey){
  return Object.keys(STATE.researchHours).filter(d=> d.startsWith(ymKey) && STATE.researchHours[d]>0).length;
}

function rateForUnit(u){
  if(u.kind==='summary') return STATE.settings.summaryRate;
  if(u.kind==='review') return STATE.settings.reviewRate;
  return STATE.settings.bookRate;
}

/* ============================================================
   SCHEDULING ENGINE
   simulate forward from START_DATE, consuming UNITS pages
   according to daily hour budgets, skipping pages already
   marked complete (STATE.unitProgress).
   ============================================================ */
function remainingPages(u){
  const done = STATE.unitProgress[u.key] || 0;
  return Math.max(0, u.pages - done);
}

function simulate(maxDays=500){
  const queue = UNITS.map(u=>({...u, remaining: remainingPages(u)})).filter(u=>u.remaining>0);
  const schedule = []; // {date, type, hoursBudget, hoursUsed, assignments:[{unitKey,book,ch,name,phase,pages,kind}]}
  let qi = 0;
  const today = todayStr();
  let date = today > getStartDate() ? today : getStartDate(); // always project forward from "now", using whatever's actually left
  let dayCount = 0;
  let finishDate = null;

  while(qi < queue.length && dayCount < maxDays){
    const type = getDayType(date);
    let hoursBudget = netStudyHours(date, type);
    const assignments = [];
    let hoursUsed = 0;

    while(hoursBudget > 0.001 && qi < queue.length){
      const u = queue[qi];
      const rate = rateForUnit(u);
      const hoursNeeded = u.remaining / rate;
      if(hoursNeeded <= hoursBudget + 0.0001){
        assignments.push({unitKey:u.key, chapterKey:u.chapterKey, book:u.book, ch:u.ch, name:u.name,
          phase:u.phase, kind:u.kind, pages: u.remaining, roi:u.roi});
        hoursUsed += hoursNeeded;
        hoursBudget -= hoursNeeded;
        u.remaining = 0;
        qi++;
      } else {
        const pagesNow = Math.floor(hoursBudget * rate);
        if(pagesNow <= 0) break;
        assignments.push({unitKey:u.key, chapterKey:u.chapterKey, book:u.book, ch:u.ch, name:u.name,
          phase:u.phase, kind:u.kind, pages: pagesNow, roi:u.roi});
        u.remaining -= pagesNow;
        hoursUsed += pagesNow / rate;
        hoursBudget = 0;
      }
    }

    if(assignments.length){
      schedule.push({date, type, hoursBudget: netStudyHours(date,type), researchHours: researchHoursFor(date),
        hoursUsed, assignments});
    } else {
      schedule.push({date, type, hoursBudget: netStudyHours(date,type), researchHours: researchHoursFor(date),
        hoursUsed:0, assignments:[]});
    }
    if(qi >= queue.length && finishDate===null){ finishDate = date; }
    date = addDays(date,1);
    dayCount++;
  }
  if(finishDate===null && schedule.length) finishDate = schedule[schedule.length-1].date;
  return { schedule, finishDate, allDone: qi>=queue.length };
}

/* ============================================================
   PROGRESS CALCULATIONS
   ============================================================ */
function overallProgress(){
  let done=0;
  UNITS.forEach(u=>{ done += Math.min(u.pages, STATE.unitProgress[u.key]||0); });
  return { done, total: TOTAL_PAGES_ALL, pct: TOTAL_PAGES_ALL? Math.round(done/TOTAL_PAGES_ALL*1000)/10 : 0 };
}
function bookProgress(book){
  let done=0, total=0;
  UNITS.filter(u=>u.book===book).forEach(u=>{
    total += u.pages;
    done += Math.min(u.pages, STATE.unitProgress[u.key]||0);
  });
  return { done, total, pct: total? Math.round(done/total*1000)/10 : 0 };
}
function chapterProgress(book,ch){
  const units = UNITS.filter(u=>u.book===book && u.ch===ch);
  let done=0, total=0;
  units.forEach(u=>{ total+=u.pages; done+=Math.min(u.pages, STATE.unitProgress[u.key]||0); });
  return {done, total, pct: total? Math.round(done/total*100):0};
}
function stage1Complete(){
  const overall = overallProgress();
  return overall.total > 0 && overall.done >= overall.total;
}

/* ============================================================
   STAGE 2: WEAK-CHAPTER REVIEW + ADAPTIVE PACE + EXAM PLANNING
   ============================================================ */
const STAGE2_DEFAULT_RATE = 8; // pages/hour fallback estimate, used until enough real data accumulates

function stage2TotalPages(){
  return STATE.stage2.weakChapters.reduce((s,w)=>s+ (Number(w.notePages)||0), 0);
}
function stage2TotalDone(){
  return STATE.stage2.weakChapters.reduce((s,w)=> s + Math.min(Number(w.notePages)||0, Number(w.pagesDone)||0), 0);
}
function stage2Remaining(){
  return Math.max(0, stage2TotalPages() - stage2TotalDone());
}

// Records today's cumulative total into the progress log (overwrites today's entry if it already exists).
function stage2LogSnapshot(){
  const today = todayStr();
  const total = stage2TotalDone();
  const log = STATE.stage2.progressLog;
  const idx = log.findIndex(e=>e.date===today);
  if(idx >= 0) log[idx].totalPages = total;
  else log.push({date: today, totalPages: total});
  log.sort((a,b)=> a.date < b.date ? -1 : 1);
}

// Computes the real observed pace (pages/hour) from the logged snapshots, using each day's
// actual available hours (respecting oncall/after/research overrides already in the system).
// Falls back to STAGE2_DEFAULT_RATE until there are at least two distinct data points.
function stage2EffectiveRate(){
  const log = STATE.stage2.progressLog;
  if(log.length < 2) return { rate: STAGE2_DEFAULT_RATE, isReal: false, daysOfData: log.length };
  const first = log[0], last = log[log.length-1];
  const pagesDelta = last.totalPages - first.totalPages;
  if(pagesDelta <= 0) return { rate: STAGE2_DEFAULT_RATE, isReal: false, daysOfData: log.length };
  let hoursSum = 0;
  let d = first.date;
  while(d <= last.date){
    hoursSum += netStudyHours(d, getDayType(d));
    d = addDays(d, 1);
  }
  if(hoursSum <= 0) return { rate: STAGE2_DEFAULT_RATE, isReal: false, daysOfData: log.length };
  return { rate: pagesDelta / hoursSum, isReal: true, daysOfData: log.length };
}

// Distributes `count` exam blocks of `daysPerExam` consecutive days each, evenly spaced
// between startDate and endDate. Returns a Set of blocked date strings.
function stage2ExamBlockDates(startDate, endDate, count, daysPerExam){
  const blocked = new Set();
  if(!count || count <= 0 || !daysPerExam) return blocked;
  const totalDays = Math.max(1, Math.round((parseLocalDate(endDate)-parseLocalDate(startDate))/86400000));
  const interval = Math.max(daysPerExam+1, Math.floor(totalDays / (count+1)));
  for(let i=1; i<=count; i++){
    const blockStart = addDays(startDate, interval*i);
    for(let k=0;k<daysPerExam;k++){
      const d = addDays(blockStart, k);
      if(d <= endDate) blocked.add(d);
    }
  }
  return blocked;
}

// Forward projection for stage 2: consumes weak-chapter note-pages using the adaptive rate,
// skipping exam-blocked days entirely (0 hours), respecting the same day-type system as stage 1.
function simulateStage2(maxDays=400){
  const remaining = STATE.stage2.weakChapters
    .map(w=>({...w, remaining: Math.max(0, (Number(w.notePages)||0) - (Number(w.pagesDone)||0))}))
    .filter(w=>w.remaining>0);
  const totalRemaining = remaining.reduce((s,w)=>s+w.remaining,0);
  const {rate, isReal, daysOfData} = stage2EffectiveRate();

  const today = todayStr();
  // rough horizon for spacing exam blocks: target date if given, else a naive estimate ignoring exams
  let horizonEnd = STATE.stage2.targetExamDate;
  if(!horizonEnd){
    const naiveDaysNeeded = rate>0 ? Math.ceil(totalRemaining / (rate * 6)) : 60; // assume ~6 net hrs/day as rough default
    horizonEnd = addDays(today, Math.max(30, naiveDaysNeeded + 14));
  }
  const examBlocks = stage2ExamBlockDates(today, horizonEnd, STATE.stage2.examCount, STATE.stage2.daysPerExam);

  let qi = 0, date = today, dayCount = 0, finishDate = null;
  const queue = remaining.map(w=>({...w}));
  const schedule = [];

  while(qi < queue.length && dayCount < maxDays){
    const isExamDay = examBlocks.has(date);
    const type = getDayType(date);
    let hoursBudget = isExamDay ? 0 : netStudyHours(date, type);
    const assignments = [];
    while(hoursBudget > 0.001 && qi < queue.length){
      const w = queue[qi];
      const hoursNeeded = w.remaining / rate;
      if(hoursNeeded <= hoursBudget + 0.0001){
        assignments.push({key:w.key, book:w.book, ch:w.ch, name:w.name, pages:w.remaining});
        hoursBudget -= hoursNeeded;
        w.remaining = 0;
        qi++;
      } else {
        const pagesNow = Math.floor(hoursBudget * rate);
        if(pagesNow<=0) break;
        assignments.push({key:w.key, book:w.book, ch:w.ch, name:w.name, pages:pagesNow});
        w.remaining -= pagesNow;
        hoursBudget = 0;
      }
    }
    schedule.push({date, isExamDay, assignments});
    if(qi >= queue.length && finishDate===null) finishDate = date;
    date = addDays(date,1);
    dayCount++;
  }
  if(finishDate===null && schedule.length) finishDate = schedule[schedule.length-1].date;

  // buffer-day estimate: total calendar days in the window that weren't needed for the workload itself
  let bufferDays = null;
  if(STATE.stage2.targetExamDate && finishDate){
    bufferDays = Math.round((parseLocalDate(STATE.stage2.targetExamDate)-parseLocalDate(finishDate))/86400000);
  }

  return { schedule, finishDate, totalRemaining, rate, isReal, daysOfData, examBlocks, bufferDays };
}

  else if(ACTIVE_TAB==='progress') panels.appendChild(renderProgress());
  else if(ACTIVE_TAB==='chapters') panels.appendChild(renderChapters());
  else if(ACTIVE_TAB==='syllabus') panels.appendChild(renderSyllabus());
  else if(ACTIVE_TAB==='stage2') panels.appendChild(renderStage2());
  else if(ACTIVE_TAB==='settings') panels.appendChild(renderSettings());
}

/* ---------- TODAY TAB ---------- */
function renderToday(schedule){
  const wrap = el(`<div class="tab-panel active"></div>`);
  const today = todayStr();
  let day = schedule.find(d=>d.date===today);
  let usingFallback = false;
  if(!day){
    day = schedule.find(d=> d.date >= today) || schedule[0];
    usingFallback = true;
  }
  if(!day){
    wrap.appendChild(el(`<div class="card"><div class="empty-note">אין עוד ימי לימוד מתוכננים - כל החומר הושלם! 🎉</div></div>`));
    return wrap;
  }

  const type = day.type;
  const typeLabel = type==='regular' ? 'יום רגיל' : (type==='oncall' ? 'יום תורנות' : 'יום אחרי תורנות');
  const researchToday = researchHoursFor(day.date);
  const researchCountMonth = countResearchDaysInMonth(monthKey(day.date));

  const card = el(`
    <div class="card">
      <div class="today-head">
        <div>
          <div class="today-date">${usingFallback ? 'היום הקרוב עם למידה מתוכננת:' : 'היום'} — ${dayLabel(day.date)} (${day.date})</div>
          <h2>${typeLabel}</h2>
        </div>
        <select class="daytype-select" id="daytype-override">
          <option value="">שיוך אוטומטי (${typeLabel})</option>
          <option value="regular">סמן כיום רגיל</option>
          <option value="oncall">סמן כיום תורנות</option>
          <option value="after">סמן כיום אחרי תורנות</option>
        </select>
      </div>
      <div class="hint">תקציב למידה להיום: ${netStudyHours(day.date,type).toFixed(1)} שעות (אחרי ${STATE.settings.dailyFixedHours} שעות תרגול+אנקי${researchToday>0?` ו-${researchToday} שעות מחקר`:''})</div>
      <div class="daily-fixed" style="margin-top:0;margin-bottom:8px;">
        <div class="fixed-item">
          <label style="font-size:13.5px">שעות מחקר/כתיבה היום:</label>
          <input type="number" min="0" max="2" step="0.5" id="research-input" value="${researchToday}"/>
        </div>
        <div class="fixed-item" style="color:${researchCountMonth>4?'var(--warn)':'var(--ink-soft)'};font-size:12.5px;">
          ${researchCountMonth} מתוך 4 ימי מחקר מומלצים החודש (${monthKey(day.date)})
        </div>
      </div>
      <div class="assign-list" id="assign-list"></div>
    </div>
  `);

  card.querySelector('#research-input').onchange = (e)=>{
    const v = Math.max(0, Math.min(2, Number(e.target.value)||0));
    if(v===0) delete STATE.researchHours[day.date];
    else STATE.researchHours[day.date] = v;
    saveState(); render();
  };

  card.querySelector('#daytype-override').onchange = (e)=>{
    const v = e.target.value;
    if(v==='') delete STATE.dayOverrides[day.date];
    else STATE.dayOverrides[day.date] = v;
    saveState(); render();
  };

  const list = card.querySelector('#assign-list');
  if(!day.assignments.length){
    list.appendChild(el(`<div class="empty-note">אין משימות קריאה ליום זה.</div>`));
  }
  day.assignments.forEach(a=>{
    const meta = BOOK_META[a.book];
    const done = STATE.unitProgress[a.unitKey]||0;
    const phaseLabel = a.phase===1 ? (a.kind==='summary'?'קריאה מהסיכום':'קריאה מהספר') : 'חזרה על הסיכום';
    const item = el(`
      <div class="assign-item">
        <div class="assign-top">
          <div>
            <span class="pill" style="background:${meta.bg};color:${meta.color}">${meta.label}</span>
            <span class="assign-title">פרק ${a.ch}: ${a.name}</span>

        </div>

          <label style="font-size:12.5px;color:var(--ink-soft)">עמודים שהספקת בפועל:</label>
          <input type="number" min="0" value="${done}" data-unit="${a.unitKey}" class="progress-input"/>
          <button class="btn small mark-done" data-unit="${a.unitKey}" data-pages="${done + a.pages}">סמנתי כהושלם</button>
        </div>
      </div>
    `);
    list.appendChild(item);
  });

  list.querySelectorAll('.progress-input').forEach(inp=>{
    inp.onchange = (e)=>{
      const key = e.target.dataset.unit;
      const v = Math.max(0, Number(e.target.value)||0);
      STATE.unitProgress[key] = v;
      saveState(); render();
    };
  });
  list.querySelectorAll('.mark-done').forEach(btn=>{
    btn.onclick = (e)=>{
      const key = e.target.dataset.unit;
      const v = Number(e.target.dataset.pages);
      STATE.unitProgress[key] = v;
      saveState(); render();
    };
  });

  const log = STATE.dailyLog[day.date] || {practice:false, anki:false};
  const fixedCard = el(`
    <div class="card">
      <h2>משימות יומיות קבועות</h2>
      <div class="hint">10-20 שאלות תרגול מחומר שנלמד + כרטיסיות אנקי</div>

    STATE.dailyLog[day.date] = {...(STATE.dailyLog[day.date]||{}), practice:e.target.checked};

  };

    STATE.dailyLog[day.date] = {...(STATE.dailyLog[day.date]||{}), anki:e.target.checked};
    saveState();

/* ---------- ON-CALL MONTHLY EDITOR ---------- */
function renderOnCall(){
  const wrap = el(`<div class="tab-panel active"></div>`);
  if(!CAL_MONTH_VIEW) CAL_MONTH_VIEW = (todayStr() < getStartDate() ? getStartDate() : todayStr()).slice(0,7);

  const card = el(`
    <div class="card">
      <h2>הזנת תורנויות לחודש</h2>
      <div class="hint">בתחילת כל חודש, הזן את כל תאריכי התורנות (מספרי ימים בחודש, מופרדים בפסיקים). היום שאחרי כל תורנות יסומן אוטומטית כ"אחרי תורנות".</div>
      <div class="month-picker">
        <label>חודש:</label>
        <input type="month" id="month-input" value="${CAL_MONTH_VIEW}"/>
      </div>
      <textarea id="oncall-input" placeholder="לדוגמה: 3, 8, 14, 19, 24, 29"></textarea>
      <div style="margin-top:10px">
        <button class="btn" id="save-oncall">שמור תורנויות לחודש זה</button>
        <button class="btn secondary" id="clear-oncall">נקה ידני לחודש זה (חזרה לברירת מחדל)</button>
      </div>
      <div class="oncall-days" id="oncall-preview"></div>
      <div class="footnote">אם לא תזין תורנויות לחודש מסוים, המערכת תניח כברירת מחדל 6 תורנויות מפוזרות (כל 5 ימים) לצורך התחזית קדימה.</div>
      <div class="footnote"><b>אין בכלל תורנויות החודש?</b> השאר את השדה ריק ולחץ "שמור תורנויות לחודש זה" בכל זאת - זה יסמן את החודש כ"כל הימים רגילים", במקום להשתמש בהנחת ברירת המחדל.</div>
    </div>
  `);

  function refreshPreview(){
    const ym = card.querySelector('#month-input').value;
    const [y,m] = ym.split('-').map(Number);
    const daysInMonth = new Date(y,m,0).getDate();
    const preview = card.querySelector('#oncall-preview');
    preview.innerHTML = '';
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = ym+'-'+String(d).padStart(2,'0');
      const type = getDayType(dateStr);
      const chip = el(`<span class="day-chip ${type==='oncall'?'oncall':type==='after'?'after':''}">${d}</span>`);
      preview.appendChild(chip);
    }
  }

  function loadTextareaFor(ym){
    const ta = card.querySelector('#oncall-input');
    const existing = [];
    const [y,m] = ym.split('-').map(Number);
    const daysInMonth = new Date(y,m,0).getDate();
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = ym+'-'+String(d).padStart(2,'0');
      if(STATE.dayOverrides[dateStr]==='oncall') existing.push(d);
    }
    ta.value = existing.join(', ');
  }

  card.querySelector('#month-input').onchange = (e)=>{
    CAL_MONTH_VIEW = e.target.value;
    loadTextareaFor(CAL_MONTH_VIEW);
    refreshPreview();
  };

  card.querySelector('#save-oncall').onclick = ()=>{
    const ym = card.querySelector('#month-input').value;
    const raw = card.querySelector('#oncall-input').value;
    const days = raw.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>!isNaN(n) && n>0);
    const [y,m] = ym.split('-').map(Number);
    const daysInMonth = new Date(y,m,0).getDate();
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = ym+'-'+String(d).padStart(2,'0');
      delete STATE.dayOverrides[dateStr];
    }
    days.forEach(d=>{
      if(d>daysInMonth) return;
      const dateStr = ym+'-'+String(d).padStart(2,'0');
      STATE.dayOverrides[dateStr] = 'oncall';
      if(d+1<=daysInMonth && !days.includes(d+1)){
        const nextStr = ym+'-'+String(d+1).padStart(2,'0');
        STATE.dayOverrides[nextStr] = 'after';
      }
    });
    STATE.dayOverrides['__month_entered__'+ym] = true;
    saveState();
    refreshPreview();
  };

  card.querySelector('#clear-oncall').onclick = ()=>{
    const ym = card.querySelector('#month-input').value;
    const [y,m] = ym.split('-').map(Number);
    const daysInMonth = new Date(y,m,0).getDate();
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = ym+'-'+String(d).padStart(2,'0');
      delete STATE.dayOverrides[dateStr];
    }
    delete STATE.dayOverrides['__month_entered__'+ym];
    card.querySelector('#oncall-input').value='';
    saveState();
    refreshPreview();
  };

  loadTextareaFor(CAL_MONTH_VIEW);
  setTimeout(refreshPreview, 0);
  wrap.appendChild(card);
  return wrap;
}

      const total = c.pp + c.rp;
      const srcLabel = c.src==='summary' ? 'סיכום בלבד' : c.src==='book+review' ? 'ספר + חזרת סיכום' : 'ספר בלבד';

          <td>${c.name}</td>
          <td>${c.roi}</td>
          <td><span class="src-badge">${srcLabel}</span>${estBadge}</td>
          <td>${total}</td>
          <td>${c.prog.pct}% (${c.prog.done}/${c.prog.total})</td>
        </tr>
      `));
    });
  }

  card.querySelector('#filter-book').onchange = (e)=>{ CHAPTER_FILTER.book = e.target.value; refreshTable(); };
  card.querySelector('#filter-sort').onchange = (e)=>{ CHAPTER_FILTER.sort = e.target.value; refreshTable(); };

  setTimeout(refreshTable,0);
  wrap.appendChild(card);
  return wrap;
}

function renderSyllabus(){
  const wrap = el(`<div class="tab-panel active"></div>`);

  const noteCard = el(`
    <div class="card">
      <h2>סילבוס - צ'ק ליסט מלא</h2>
      <div class="hint">

        כל פרק כאן <b>נמצא בתוכנית הלימוד</b> ומתעדכן אוטומטית לפי ההתקדמות שסימנת בטאבים האחרים.
        פרקים שלא הופיעו ברשימת ה-ROI המקורית נוספו בעדיפות הנמוכה ביותר (נלמדים אחרונים בסבב של כל ספר, ישירות מהספר, ללא סבב חזרה נוסף) - כך שהם עדיין מכוסים, רק בפחות זמן/תשומת לב, בהתאם למה שביקשת.
      </div>
      <div class="hint" style="color:var(--warn)">
        ⚠️ שים לב: זיהיתי אי-התאמה אפשרית במספור הפרקים של Speroff בין המהדורה ה-9 (עליה מבוסס הסילבוס והדירוג ROI) לבין מהדורה 10 (ממנה הגיעו מספרי העמודים). פרקים המסומנים ב"מוערך" קיבלו הערכת עמודים ידנית (לא מחושבת) בגלל אי-ההתאמה הזו - כדאי להצליב מול הספר בפועל אם דיוק העמודים קריטי לך.
      </div>
    </div>
  `);
  wrap.appendChild(noteCard);

  ['Gabbe','Novak','Speroff'].forEach(book=>{
    const meta = BOOK_META[book];
    const items = SYLLABUS_RAW.filter(s=>s.book===book).sort((a,b)=>a.ch-b.ch);
    const card = el(`
      <div class="card">
        <h2><span class="pill" style="background:${meta.bg};color:${meta.color}">${meta.label}</span> (${items.length} פרקים בסילבוס)</h2>
        <div class="assign-list" id="syl-${book}"></div>
      </div>
    `);
    const list = card.querySelector(`#syl-${book}`);
    items.forEach(it=>{
      const chData = CHAPTERS_RAW.find(c=>c.book===it.book && c.ch===it.ch);
      const prog = chapterProgress(it.book, it.ch);
      const checked = prog.pct>=100;
      const estBadge = chData && chData.est ? ' <span class="src-badge" style="color:var(--warn)">מוערך</span>' : '';
      const lowPriority = chData && chData.roi<=1 ? ' · עדיפות נמוכה (לא ברשימת ה-ROI)' : '';
      const row = el(`
        <div class="assign-item" style="flex-direction:row; align-items:center; justify-content:space-between;">
          <div>
            <span class="assign-title">פרק ${it.ch}: ${it.name}</span>${estBadge}
            <div class="assign-meta">התקדמות: ${prog.pct}%${lowPriority}</div>
          </div>
          <input type="checkbox" style="width:20px;height:20px;" ${checked?'checked':''} disabled/>
        </div>
      `);
      list.appendChild(row);
    });
    wrap.appendChild(card);
  });

  return wrap;
}

/* ---------- STAGE 2 TAB ---------- */
function renderStage2(){
  const wrap = el(`<div class="tab-panel active"></div>`);
  const st2 = STATE.stage2;

  // ---- Add weak chapter card ----
  const addCard = el(`
    <div class="card">
      <h2>הוספת פרקים חלשים</h2>
      <div class="hint">בחר ספר ופרק מהרשימה המלאה, הזן כמות עמודי הערות לחזרה, והוסף לרשימה.</div>
      <div class="settings-grid">
        <div class="setting-item">
          <label>ספר</label>
          <select id="s2-book">
            <option value="Gabbe">מיילדות (Gabbe)</option>
            <option value="Novak">גניקולוגיה (Novak)</option>
            <option value="Speroff">פוריות (Speroff)</option>
          </select>
        </div>
        <div class="setting-item">
          <label>פרק</label>
          <select id="s2-chapter"></select>
        </div>
        <div class="setting-item">
          <label>עמודי הערות לחזרה</label>
          <input type="number" min="1" id="s2-notepages" placeholder="למשל 10"/>
        </div>
      </div>
      <div style="margin-top:12px"><button class="btn" id="s2-add-btn">הוסף לרשימה</button></div>
    </div>
  `);

  function populateChapterSelect(){
    const book = addCard.querySelector('#s2-book').value;
    const chSelect = addCard.querySelector('#s2-chapter');
    const chapters = CHAPTERS_RAW.filter(c=>c.book===book).sort((a,b)=>a.ch-b.ch);
    chSelect.innerHTML = chapters.map(c=>`<option value="${c.ch}">${c.ch}. ${c.name}</option>`).join('');
  }
  addCard.querySelector('#s2-book').onchange = populateChapterSelect;
  populateChapterSelect();

  addCard.querySelector('#s2-add-btn').onclick = ()=>{
    const book = addCard.querySelector('#s2-book').value;
    const ch = Number(addCard.querySelector('#s2-chapter').value);
    const notePages = Number(addCard.querySelector('#s2-notepages').value);
    if(!notePages || notePages<=0){ return; }
    const chData = CHAPTERS_RAW.find(c=>c.book===book && c.ch===ch);
    const key = book+'-'+ch+'-weak-'+Date.now();
    st2.weakChapters.push({key, book, ch, name: chData ? chData.name : ('פרק '+ch), notePages, pagesDone:0});
    stage2LogSnapshot();
    saveState(); render();
  };

  // ---- Weak chapters list ----
  const listCard = el(`
    <div class="card">
      <h2>רשימת פרקים חלשים (${st2.weakChapters.length})</h2>
      <div class="assign-list" id="s2-list"></div>
    </div>
  `);
  const list = listCard.querySelector('#s2-list');
  if(!st2.weakChapters.length){
    list.appendChild(el(`<div class="empty-note">עדיין לא הוספת פרקים חלשים.</div>`));
  }
  st2.weakChapters.forEach(w=>{
    const meta = BOOK_META[w.book];
    const pct = w.notePages ? Math.round(Math.min(w.pagesDone,w.notePages)/w.notePages*100) : 0;
    const item = el(`
      <div class="assign-item">
        <div class="assign-top">
          <div>
            <span class="pill" style="background:${meta.bg};color:${meta.color}">${meta.label}</span>
            <span class="assign-title">פרק ${w.ch}: ${w.name}</span>
          </div>
          <div class="assign-meta">${pct}% · מתוך ${w.notePages} עמ' הערות</div>
        </div>
        <div class="assign-controls">
          <label style="font-size:12.5px;color:var(--ink-soft)">עמודים שהספקת:</label>
          <input type="number" min="0" max="${w.notePages}" value="${w.pagesDone}" data-key="${w.key}" class="s2-progress-input"/>
          <button class="btn small secondary" data-key="${w.key}" style="margin-inline-start:auto">הסר</button>
        </div>
      </div>
    `);
    item.querySelector('.s2-progress-input').onchange = (e)=>{
      const v = Math.max(0, Math.min(w.notePages, Number(e.target.value)||0));
      w.pagesDone = v;
      stage2LogSnapshot();
      saveState(); render();
    };
    item.querySelector('button').onclick = ()=>{
      st2.weakChapters = st2.weakChapters.filter(x=>x.key!==w.key);
      saveState(); render();
    };
    list.appendChild(item);
  });

  // ---- Exam planning card ----
  const examCard = el(`
    <div class="card">
      <h2>תכנון מבחנים</h2>
      <div class="settings-grid">
        <div class="setting-item"><label>כמות מבחני תרגול מתוכננים</label><input type="number" min="0" id="s2-examcount" value="${st2.examCount ?? ''}" placeholder="אפשר להשאיר ריק"/></div>
        <div class="setting-item"><label>ימים חסומים לכל מבחן</label><input type="number" min="1" id="s2-daysperexam" value="${st2.daysPerExam}"/></div>
        <div class="setting-item"><label>תאריך יעד למבחן שלב א' (אופציונלי)</label><input type="date" id="s2-targetdate" value="${st2.targetExamDate||''}"/></div>
      </div>
      <div style="margin-top:12px"><button class="btn" id="s2-save-exam">שמור</button></div>
      <div class="footnote">ימי המבחנים ייחסמו לגמרי (0 שעות למידה) ויתפזרו באופן שווה על פני התקופה עד תאריך היעד (או עד התאריך המשוער אם לא הוזן יעד).</div>
    </div>
  `);
  examCard.querySelector('#s2-save-exam').onclick = ()=>{
    const countVal = examCard.querySelector('#s2-examcount').value;
    st2.examCount = countVal==='' ? null : Math.max(0, Number(countVal));
    st2.daysPerExam = Math.max(1, Number(examCard.querySelector('#s2-daysperexam').value)||4);
    const dateVal = examCard.querySelector('#s2-targetdate').value;
    st2.targetExamDate = dateVal || null;
    saveState(); render();
  };

  // ---- Forecast card ----
  const sim = simulateStage2();
  const rateLabel = sim.isReal
    ? `${sim.rate.toFixed(1)} עמ׳/שעה (קצב אמיתי, מבוסס על ${sim.daysOfData} ימי נתונים)`
    : `${sim.rate.toFixed(1)} עמ׳/שעה (הערכת ברירת מחדל - עדיין אין מספיק נתונים; עדכן "עמודים שהספקת" בכמה ימים שונים כדי שהקצב האמיתי ייכנס לתמונה)`;
  const finishLabel = sim.finishDate ? parseLocalDate(sim.finishDate).toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'}) : '—';

  let statusHtml = '';
  if(st2.targetExamDate && sim.finishDate){
    const onTrack = sim.bufferDays >= 0;
    statusHtml = `
      <div class="hint" style="color:${onTrack?'var(--ok)':'var(--warn)'}; font-weight:700;">
        ${onTrack ? `✅ בקצב הנוכחי, תסיים כ-${sim.bufferDays} ימים לפני תאריך היעד.` : `⚠️ בקצב הנוכחי, אתה צפוי לסיים כ-${Math.abs(sim.bufferDays)} ימים אחרי תאריך היעד - כדאי להעלות קצב/שעות.`}
      </div>`;
    if(onTrack && sim.bufferDays>0){
      const perExam = st2.examCount>0 ? Math.round(sim.bufferDays/st2.examCount) : sim.bufferDays;
      statusHtml += `<div class="footnote">יש לך כ-${sim.bufferDays} ימים גמישים לקריאה חוזרת של ההערות מעבר למינימום הנדרש. ${st2.examCount>0 ? `מומלץ לפזר אותם כ-${perExam} ימים אחרי כל מבחן תרגול, לצורך תחקור.` : 'מומלץ לפזר אותם בין המבחנים לתחקור ולחיזוק.'}</div>`;
    }
  } else if(!st2.targetExamDate){
    statusHtml = `<div class="footnote">הזן תאריך יעד למבחן כדי לקבל התראה האם אתה בזמן, והמלצה כמה ימים פנויים לחזרה על ההערות.</div>`;
  }

  const forecastCard = el(`
    <div class="card">
      <h2>תחזית שלב 2</h2>
      <div class="domain-row">
        <span class="domain-tag" style="background:var(--navy);color:#fff">נותרו</span>
        <span style="font-weight:700">${sim.totalRemaining} עמ' הערות</span>
      </div>
      <div class="hint">קצב אפקטיבי: ${rateLabel}</div>
      <div class="hint">תאריך סיום משוער לשלב 2: <b>${finishLabel}</b></div>
      ${statusHtml}
    </div>
  `);

  wrap.appendChild(addCard);
  wrap.appendChild(listCard);
  wrap.appendChild(examCard);
  wrap.appendChild(forecastCard);
  return wrap;
}

      <div class="hint" style="margin-top:18px;">ייבוא / שחזור מקובץ גיבוי קודם - זה ידרוס את הנתונים הנוכחיים בכלי.</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <input type="file" id="backup-file-input" accept="application/json"/>
        <button class="btn secondary" id="backup-import-btn">ייבא ושחזר</button>
      </div>
      <div class="footnote" id="backup-status"></div>
    </div>
  `);

  backupCard.querySelector('#backup-download').onclick = ()=>{
    const json = JSON.stringify(STATE, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'study-tracker-backup-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  backupCard.querySelector('#backup-show').onclick = ()=>{
    const ta = backupCard.querySelector('#backup-textarea');
    ta.value = JSON.stringify(STATE, null, 2);
    ta.style.display = ta.style.display==='none' ? 'block' : 'none';
    if(ta.style.display==='block'){ ta.focus(); ta.select(); }
  };

  backupCard.querySelector('#backup-import-btn').onclick = ()=>{
    const fileInput = backupCard.querySelector('#backup-file-input');
    const status = backupCard.querySelector('#backup-status');
    const file = fileInput.files && fileInput.files[0];
    if(!file){ status.textContent = 'נא לבחור קובץ גיבוי (JSON) קודם.'; return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const imported = JSON.parse(e.target.result);
        if(!imported || typeof imported !== 'object'){ throw new Error('invalid'); }
        mergeIncomingState(imported);
        saveState();
        status.textContent = 'הנתונים שוחזרו בהצלחה!';
        render();
      }catch(err){
        status.textContent = 'הקובץ לא תקין - ודא שזה קובץ גיבוי JSON שיוצא מהכלי הזה.';
      }
    };
    reader.readAsText(file);
  };

  wrap.appendChild(backupCard);
  return wrap;
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  await loadState();
  render();
})();


</script>
</body>
</html>
